elledby="homework-title"><div class="homework-head"><div><h2 id="homework-title">숙제 체크리스트</h2><p>수업 날짜를 눌러 숙제와 단어 범위를 확인해. 체크 기록은 이 브라우저에 저장돼.</p></div></div><div id="homework-list"></div></section></main><script>
