<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>단어 기억장</title><style>
:root{color-scheme:light;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#222b38;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid #e4e7eb}.head{max-width:1160px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:17px;font-weight:800;letter-spacing:-.05em}.day{font-size:12px;color:#89919d;margin-left:9px;font-weight:500}.modes{display:flex;padding:3px;background:#f0f2f5;border-radius:8px;gap:2px}.modes button{padding:8px 15px;border:0;background:transparent;color:#77808d;border-radius:6px;font-weight:700;font-size:13px}.modes button.active{background:white;color:#253654;box-shadow:0 1px 4px #00000012}main{max-width:1160px;margin:auto;padding:26px 20px 60px}.intro{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:17px}h1{font-size:23px;letter-spacing:-.05em;margin:0 0 5px}p{font-size:13px;color:#8a929d;margin:0}.counts{font-size:13px;color:#7f8996;white-space:nowrap}.counts b{color:#344f9f}.counts .x{color:#c16b68}.sheet{background:#fff;border:1px solid #e3e7ec;border-radius:10px;overflow:hidden}.tools{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #e6e9ed;flex-wrap:wrap}.filters{display:flex;gap:4px}.filters button,.simple{border:0;background:none;color:#89929e;border-radius:6px;padding:7px 10px;font-size:12px;font-weight:700}.filters button.active{background:#edf1fa;color:#4562ad}.search{margin-left:auto;width:170px;border:1px solid #e4e8ee;border-radius:6px;padding:7px 9px;outline:none;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr}.column:first-child{border-right:1px solid #e2e5e9}.row{display:grid;grid-template-columns:36px minmax(100px, .85fr) minmax(110px, 1.2fr) 62px;min-height:39px;border-bottom:1px solid #edf0f2;align-items:stretch}.row:last-child{border-bottom:0}.num{display:flex;align-items:center;justify-content:center;background:#f1f2f4;color:#929aa5;font-size:11px}.word{display:flex;align-items:center;padding:6px 10px;font-size:13px;font-weight:700;overflow-wrap:anywhere}.meaning{display:flex;align-items:center;margin:4px 2px;padding:4px 8px;font-size:12px;line-height:1.35;color:#4e5764;overflow-wrap:anywhere}.cover{width:calc(100% - 4px);text-align:left;border:0;border-radius:3px;background:#e9ecf0;color:transparent;min-height:28px}.cover:hover,.cover:focus-visible{background:#dce2eb}.cover.open{background:transparent;color:#404a58}.marks{display:flex;align-items:center;justify-content:center;gap:1px}.marks button{width:28px;height:28px;border:0;background:transparent;border-radius:5px;color:#c7cdd5;font-weight:800;font-size:15px}.marks .yes.on{background:#e8efff;color:#526fc1}.marks .no.on{background:#fcedec;color:#cc7770}.book .row{grid-template-columns:36px minmax(100px,.85fr) minmax(110px,1.4fr)}.empty{padding:45px 20px;text-align:center;color:#a0a7b0;font-size:13px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.footer p{font-size:11px}.reset{color:#ac9694}.hidden{display:none!important}@media(max-width:480px){.head{padding:12px}.day{display:none}main{padding:20px 12px 45px}.intro{align-items:start;flex-direction:column;gap:8px}h1{font-size:20px}.grid{grid-template-columns:1fr}.column:first-child{border-right:0;border-bottom:1px solid #e2e5e9}.row{grid-template-columns:32px minmax(80px,.85fr) minmax(90px,1.15fr) 58px;min-height:38px}.book .row{grid-template-columns:32px minmax(90px,.85fr) minmax(100px,1.4fr)}.word{font-size:12px;padding:5px 7px}.meaning{font-size:12px}.search{width:125px}.tools{padding:8px}.filters button{padding:7px}.modes button{padding:7px 11px}}

/* 종이 단어장에 가까운 담백한 구성 */
:root{background:#edeae3;color:#292c30}body{font-family:Georgia,'Times New Roman',serif}.top{background:#f8f7f3;border-color:#d8d5cd}.head{max-width:1200px}.brand{font-family:Georgia,serif;font-size:19px;color:#27352f;letter-spacing:-.04em}.day{font-family:sans-serif;letter-spacing:.08em;color:#98968c}.modes{background:#e8e7e1;border-radius:3px}.modes button{font-family:sans-serif;border-radius:2px}.modes button.active{color:#344f42;box-shadow:none;background:#fff}.intro h1{font-family:Georgia,'Times New Roman',serif;color:#27352f}.intro p,.counts,.tools,.footer{font-family:Arial,sans-serif}.sheet{border-radius:2px;border-color:#d9d6cd;box-shadow:0 6px 20px #31372c0b}.tools{background:#fbfaf7;border-color:#deddd6}.filters button.active{color:#41614d;background:#e7ede7}.simple{color:#7b8278}.shuffle{margin-left:3px;color:#506857;border:1px solid #d8ded5;background:#f8faf7}.search{background:#fff;border-color:#dddcd5}.column:first-child{border-color:#cccac2}.row{border-color:#e9e8e1}.num{background:#f0f0eb;color:#999a91;font-family:Arial,sans-serif}.word{font-family:Georgia,serif;color:#29382e}.meaning{font-family:Arial,sans-serif}.cover{background:#e8ece7}.cover:hover,.cover:focus-visible{background:#dce5dd}.cover.open{background:transparent}.marks{font-family:Arial,sans-serif}.marks .yes.on{background:#e8efe9;color:#527960}.marks .no.on{background:#f7eae6;color:#af655d}
@media(max-width:480px){main{padding:18px 7px 40px}.head{padding:12px 10px}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.column{min-width:0}.column:first-child{border-right:1px solid #d6d5ce;border-bottom:0}.row,.book .row{grid-template-columns:24px minmax(0,1fr) 45px;grid-template-rows:auto auto;min-height:53px}.num{grid-row:1 / 3;font-size:10px}.word{grid-column:2;grid-row:1;padding:6px 4px 1px;font-size:12px;line-height:1.15}.meaning{grid-column:2 / 4;grid-row:2;margin:2px 3px 4px;padding:3px 5px;font-size:11px;line-height:1.25;min-height:20px}.cover{width:calc(100% - 6px);min-height:20px}.marks{grid-column:3;grid-row:1;gap:0}.marks button{width:22px;height:24px;font-size:13px}.book .word{grid-column:2 / 4}.book .meaning{grid-column:2 / 4}.tools{gap:3px}.filters button,.simple{padding:7px 6px;font-size:11px}.search{width:100px;min-width:0}.shuffle{margin-left:0}.intro{margin-left:4px}.footer{padding:0 5px}}

/* Neutral ink, readable system fonts, and restrained blue accents. */
:root{color-scheme:dark;background:#101114;color:#ededf0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}body,.brand,.intro h1,.word,.meaning,.num,.modes button,.intro p,.counts,.tools,.footer{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}body{background:#101114}.top{background:#18191c;border-color:#35363b}.brand,.intro h1{color:#f2f3f6}.day,p,.counts{color:#a3a6af}.modes{background:#24262b;border-radius:7px}.modes button{color:#b4b8c3;border-radius:5px}.modes button.active{color:#fff;background:linear-gradient(120deg,#243874,#315ec2)}.sheet{background:#1b1c20;border:1px solid #393b42;border-radius:6px;box-shadow:none}.tools{background:#202126;border-color:#3b3d44}.filters button,.simple{color:#b3b7c2}.filters button.active{color:#fff;background:linear-gradient(115deg,#263c79,#365fc4)}.shuffle{margin-left:22px;color:#c8d7ff;border:1px solid #44577b;background:#252c3d}.search{background:#25262b;border-color:#484b53;color:#f0f1f3}.column:first-child{border-color:#4a4b50}.row{border-color:#383a40}.num{background:#24252a;color:#a5a8b1}.word{color:#f1f2f4;font-weight:650;letter-spacing:0}.meaning{color:#e1e3e8}.cover{background:#464a52}.cover:hover,.cover:focus-visible{background:#59657d}.cover.open{background:transparent;color:#f0f1f4}.marks button{color:#8c909b}.marks .yes.on{background:#293d70;color:#bad1ff}.marks .no.on{background:#383b44;color:#f0f1f3}.counts b,.counts .x{color:#aac3ff}.footer p{color:#999da7}.reset{color:#acadb4}
@media(min-width:481px) and (max-width:700px){main{padding:22px 10px}.row{grid-template-columns:28px minmax(0,.82fr) minmax(0,1.12fr) 48px}.book .row{grid-template-columns:28px minmax(0,.85fr) minmax(0,1.4fr)}.word{font-size:12px;padding:5px 6px}.meaning{font-size:11px;padding:4px}.marks{gap:0}.marks button{width:24px}.num{font-size:10px}.shuffle{margin-left:18px}.search{width:135px}}

</style></head><body><header class="top"><div class="head"><div class="brand">단어 기억장<span class="day">DAY 42 — 44</span></div><nav class="modes" aria-label="모드 변경"><button data-mode="test" class="active" aria-pressed="true">테스트</button><button data-mode="book" aria-pressed="false">단어장</button></nav></div></header><main><div class="intro"><div><h1 id="title">단어 테스트</h1><p id="description">뜻이 가려진 칸을 눌러 확인하고 O 또는 X로 표시해.</p></div><div class="counts" id="counts">전체 120 · <b>O 0</b> · <b class="x">X 0</b></div></div><section class="sheet"><div class="tools"><div class="filters" id="filters" aria-label="단어 필터"><button data-filter="all" class="active">전체</button><button data-filter="wrong">X만 보기</button><button data-filter="known">O만 보기</button></div><button class="simple shuffle" id="shuffle" title="단어 순서를 다시 섞어">↻ 순서 섞기</button><input id="search" class="search" placeholder="영단어 검색" aria-label="영단어 검색"></div><div id="grid" class="grid"></div></section><div class="footer"><p>학습 기록은 이 브라우저에 저장돼.</p><button class="simple reset" id="reset">기록 초기화</button></div></main><script>
(async()=>{const words=await fetch('words.json').then(r=>{if(!r.ok)throw Error();return r.json()});const key='vocab-memory-120-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}let mode='test',filter='all',revealed=new Set();const orderKey='vocab-memory-120-order-v1';try{const saved=JSON.parse(localStorage.getItem(orderKey)||'null');if(Array.isArray(saved)&&saved.length===words.length&&new Set(saved).size===words.length&&saved.every(id=>words.some(w=>w.id===id))){const rank=new Map(saved.map((id,i)=>[id,i]));words.sort((a,b)=>rank.get(a.id)-rank.get(b.id))}}catch{}function shuffleWords(){for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]]}try{localStorage.setItem(orderKey,JSON.stringify(words.map(w=>w.id)))}catch{alert('바뀐 순서를 저장하지 못했어. 브라우저 저장 공간을 확인해 줘.')}}const $=s=>document.querySelector(s),grid=$('#grid');function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('기록을 저장하지 못했어. 브라우저 저장 공간을 확인해 줘.')}}function makeRow(w){const row=document.createElement('div');row.className='row';const n=document.createElement('div');n.className='num';n.textContent=w.id;const word=document.createElement('div');word.className='word';word.textContent=w.word;let answer=document.createElement(mode==='test'?'button':'div');answer.className='meaning';if(mode==='test'){answer.classList.add('cover');if(revealed.has(w.id))answer.classList.add('open');answer.setAttribute('aria-label',w.word+' 뜻 '+(revealed.has(w.id)?'가리기':'확인'));answer.setAttribute('aria-expanded',revealed.has(w.id));answer.textContent=revealed.has(w.id)?w.meaning:' ';answer.onclick=()=>{revealed.has(w.id)?revealed.delete(w.id):revealed.add(w.id);render()}}else answer.textContent=w.meaning;row.append(n,word,answer);if(mode==='test'){const marks=document.createElement('div');marks.className='marks';for(const [value,label,cls] of [['known','O','yes'],['wrong','X','no']]){const b=document.createElement('button');b.textContent=label;b.className=cls+(state[w.id]===value?' on':'');b.setAttribute('aria-label',w.word+(value==='known'?' 외움':' 틀림'));b.setAttribute('aria-pressed',state[w.id]===value);b.onclick=()=>{state[w.id]=state[w.id]===value?undefined:value;save();render()};marks.append(b)}row.append(marks)}return row}function render(){const known=words.filter(w=>state[w.id]==='known').length,wrong=words.filter(w=>state[w.id]==='wrong').length;$('#counts').innerHTML=`전체 ${words.length} · <b>O ${known}</b> · <b class="x">X ${wrong}</b>`;$('#counts').classList.toggle('hidden',mode==='book');$('#filters').classList.toggle('hidden',mode==='book');$('#reset').classList.toggle('hidden',mode==='book');$('#title').textContent=mode==='test'?'단어 테스트':'단어장';$('#description').textContent=mode==='test'?'뜻이 가려진 칸을 눌러 확인하고 O 또는 X로 표시해.':'영단어와 뜻을 함께 살펴봐.';grid.classList.toggle('book',mode==='book');document.querySelectorAll('[data-mode]').forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));let q=$('#search').value.trim().toLowerCase();let selected=words.filter(w=>(mode==='book'||filter==='all'||state[w.id]===filter)&&(w.word.toLowerCase().includes(q)||w.meaning.includes(q)));grid.replaceChildren();if(!selected.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=q?'검색 결과가 없어.':filter==='wrong'?'X로 표시한 단어가 없어.':'표시할 단어가 없어.';grid.append(empty);return}const middle=Math.ceil(selected.length/2);for(const chunk of [selected.slice(0,middle),selected.slice(middle)]){const column=document.createElement('div');column.className='column';chunk.forEach(w=>column.append(makeRow(w)));grid.append(column)}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;revealed.clear();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;revealed.clear();render()});$('#shuffle').onclick=()=>{if(confirm('단어 순서를 다시 섞을까?')){shuffleWords();revealed.clear();render()}};$('#search').oninput=render;$('#reset').onclick=()=>{if(confirm('모든 학습 기록을 초기화할까?')){state={};revealed.clear();save();render()}};render()})().catch(()=>{document.querySelector('#grid').textContent='단어를 불러오지 못했어. 페이지를 새로고침해 줘.'});
</script></body></html>
