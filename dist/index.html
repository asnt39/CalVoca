<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단어 기억장</title><style>
:root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202a3f;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e9edf5}.top{max-width:1100px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:19px;letter-spacing:-.06em}.logo{display:inline-grid;place-items:center;background:#5572ea;color:white;width:34px;height:34px;border-radius:11px;margin-right:9px}.tag{font-size:12px;color:#8791a5}main{max-width:1100px;margin:auto;padding:38px 24px 80px}.eyebrow{color:#5b70e6;font-size:12px;font-weight:800;letter-spacing:.12em}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:32px;letter-spacing:-.06em;margin:9px 0}p{color:#7a8498;line-height:1.6;margin:0}.stats{display:flex;gap:12px;margin:28px 0}.stat{flex:1;background:white;border:1px solid #e8edf5;border-radius:16px;padding:18px 20px}.stat span{font-size:12px;color:#8390a5}.stat strong{display:block;font-size:25px;margin-top:6px}.stat:nth-child(2) strong{color:#456ddc}.stat:nth-child(3) strong{color:#e26c68}.bar{height:6px;background:#e9edf5;border-radius:9px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#5b76ef;border-radius:9px}.panel{background:#fff;border:1px solid #e7ebf2;border-radius:20px;padding:22px;box-shadow:0 10px 35px #263d6810}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;background:#f2f4f9;padding:4px;border-radius:11px;gap:3px}.tabs button{border:0;background:transparent;color:#7b879b;padding:9px 15px;border-radius:8px;font-weight:700;font-size:13px}.tabs button.active{background:#fff;color:#334fbe;box-shadow:0 2px 8px #17233d12}.search{border:1px solid #e5e9f1;border-radius:10px;padding:10px 13px;min-width:200px;outline:none}.note{font-size:12px;margin:18px 2px 12px;color:#919aad}.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{border:1px solid #ebeff5;border-radius:13px;padding:13px;display:grid;grid-template-columns:34px minmax(95px,1fr) minmax(110px,1.25fr);align-items:center;gap:8px}.num{color:#a5afc0;font-size:12px;font-weight:700}.word{font-weight:750;font-size:15px;overflow-wrap:anywhere}.answer{border:0;background:#f1f4fa;border-radius:8px;min-height:41px;padding:8px;color:#77859b;font-size:12px;text-align:center}.answer.shown{color:#33415a;background:#eef2ff;line-height:1.4}.actions{grid-column:2/4;display:flex;gap:7px}.actions button{border:1px solid #e7ebf2;background:#fff;color:#919bae;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700}.actions .yes.on{color:#4168d8;background:#edf2ff;border-color:#cfdcff}.actions .no.on{color:#cb5b59;background:#fff0ef;border-color:#ffd5d2}.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:#96a0b1;font-size:14px}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}.textbtn{background:none;border:0;color:#8894a7;font-size:12px;padding:8px}.reset{color:#b68888}.hint{font-size:12px}@media(max-width:700px){main{padding:28px 16px 60px}.top{padding:16px}.hero{display:block}h1{font-size:27px}.stats{gap:7px}.stat{padding:14px 12px}.stat strong{font-size:21px}.panel{padding:14px}.list{grid-template-columns:1fr}.tabs{width:100%}.tabs button{flex:1;padding:9px 7px}.search{width:100%}.row{grid-template-columns:30px minmax(90px,1fr) minmax(120px,1.3fr)}}
</style></head><body><header><div class="top"><div class="brand"><span class="logo">W</span>단어 기억장</div><span class="tag">DAY 42 — 44</span></div></header><main><div class="hero"><div><div class="eyebrow">YOUR VOCABULARY</div><h1>오늘도, 한 단어씩.</h1><p>뜻을 떠올린 뒤 가려진 칸을 눌러 확인해 봐.</p></div></div><section class="stats" aria-label="학습 현황"><div class="stat"><span>전체 단어</span><strong id="total">120</strong><div class="bar"><i style="width:100%;background:#c7d0e1"></i></div></div><div class="stat"><span>외웠어</span><strong id="known">0</strong><div class="bar"><i id="progress"></i></div></div><div class="stat"><span>다시 볼래</span><strong id="wrong">0</strong><div class="bar"><i id="retrybar" style="background:#ee9690"></i></div></div></section><section class="panel"><div class="toolbar"><div class="tabs" role="group" aria-label="단어 필터"><button data-filter="all" class="active">전체 <span id="allcount"></span></button><button data-filter="wrong">다시 볼 단어 <span id="wrongcount"></span></button><button data-filter="known">외운 단어 <span id="knowncount"></span></button></div><input class="search" id="search" placeholder="영단어 검색" aria-label="영단어 검색"></div><p class="note">뜻을 눌러 확인하고, 기억 여부를 직접 표시해 줘. 다시 볼 단어에서 오답을 재시험할 수 있어.</p><div class="list" id="list"></div><div class="footer"><p class="hint">학습 기록은 이 브라우저에 자동 저장돼.</p><button class="textbtn reset" id="reset">학습 기록 초기화</button></div></section></main><script>
(async()=>{const words=await fetch('words.json').then(r=>r.json());const key='vocab-memory-120-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let filter='all',shown=new Set();const $=s=>document.querySelector(s),list=$('#list');function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('학습 기록을 저장하지 못했어. 브라우저 저장 공간을 확인해 줘.')}}function render(){let known=words.filter(w=>state[w.id]==='known').length,wrong=words.filter(w=>state[w.id]==='wrong').length;$('#known').textContent=known;$('#wrong').textContent=wrong;$('#allcount').textContent=words.length;$('#knowncount').textContent=known;$('#wrongcount').textContent=wrong;$('#progress').style.width=(known/words.length*100)+'%';$('#retrybar').style.width=(wrong/words.length*100)+'%';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));let q=$('#search').value.trim().toLowerCase();let selected=words.filter(w=>(filter==='all'||state[w.id]===filter)&&w.word.toLowerCase().includes(q));list.replaceChildren();if(!selected.length){let p=document.createElement('div');p.className='empty';p.textContent=q?'검색 결과가 없어.':filter==='wrong'?'다시 볼 단어가 아직 없어. 단어를 확인한 뒤 표시해 줘.':'여기에 표시할 단어가 없어.';list.append(p);return}for(const w of selected){let row=document.createElement('article');row.className='row';let n=document.createElement('span');n.className='num';n.textContent=String(w.id).padStart(3,'0');let word=document.createElement('span');word.className='word';word.textContent=w.word;let answer=document.createElement('button');answer.className='answer'+(shown.has(w.id)?' shown':'');answer.textContent=shown.has(w.id)?w.meaning:'뜻 확인하기';answer.setAttribute('aria-label',w.word+' 뜻 '+(shown.has(w.id)?'가리기':'확인하기'));answer.onclick=()=>{shown.has(w.id)?shown.delete(w.id):shown.add(w.id);render()};let actions=document.createElement('div');actions.className='actions';for(const [v,label,cls] of [['known','✓ 외웠어','yes'],['wrong','↻ 다시 볼래','no']]){let b=document.createElement('button');b.className=cls+(state[w.id]===v?' on':'');b.textContent=label;b.setAttribute('aria-pressed',state[w.id]===v);b.onclick=()=>{state[w.id]=v;save();render()};actions.append(b)}row.append(n,word,answer,actions);list.append(row)}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;shown.clear();render()});$('#search').oninput=render;$('#reset').onclick=()=>{if(confirm('모든 학습 기록을 초기화할까?')){state={};shown.clear();save();render()}};render()})().catch(()=>{document.querySelector('#list').textContent='단어를 불러오지 못했어. 페이지를 새로고침해 줘.'});
</script></body></html>
