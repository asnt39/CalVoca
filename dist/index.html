</style><style>.deck{font:12px system-ui,sans-serif;background:#25262b;border:1px solid #484b53;color:#f0f1f3;border-radius:5px;padding:7px;max-width:230px}.head .deck{order:1}.head .brand{order:0}@media(max-width:600px){.deck{max-width:180px;font-size:11px}}</style></head><body><header class="top"><div class="head"><div class="brand">단어 기억장<span class="day">DAY 42 — 44</span></div><select id="deck" class="deck" aria-label="단어장 선택"><option value="voca">수능 고난도 Day 42–44</option><option value="voca45">수능 고난도 Day 45–47</option><option value="exam">2024년 3월 모의고사 · 223단어</option></select><nav class="modes" aria-label="모드 변경"><button data-mode="test" class="active" aria-pressed="true">테스트</button><button data-mode="book" aria-pressed="false">단어장</button></nav><span class="offline-top" id="offline-status">오프라인 준비 중…</span></div></header><main><div class="intro"><div><h1 id="title">단어 테스트</h1><p id="description">뜻이 가려진 칸을 눌러 확인하고 O 또는 X로 표시해.</p></div><div class="counts" id="counts">전체 120 · <b>O 0</b> · <b class="x">X 0</b></div></div><section class="sheet"><div class="tools"><div class="filters" id="filters" aria-label="단어 필터"><button data-filter="all" class="active">전체</button><button data-filter="wrong">X만 보기</button><button data-filter="known">O만 보기</button></div><button class="simple primary" id="retry">오답 재시험</button><div class="order-tools"><button class="simple" id="shuffle">↻ 순서 섞기</button><button class="simple" id="restore-order">원래 순서로 되돌리기</button></div></div><div class="options"><label>범위 <select id="day"><option value="all">전체</option><option value="42">Day 42</option><option value="43">Day 43</option><option value="44">Day 44</option></select></label><label>번호 <input id="from" type="number" min="1" max="120" placeholder="1" aria-label="시작 번호"> – <input id="to" type="number" min="1" max="120" placeholder="120" aria-label="끝 번호"></label><button class="simple" id="toggle-all">뜻 모두 보기</button><input id="search" class="search" placeholder="단어 또는 뜻 검색" aria-label="단어 또는 뜻 검색"></div><div id="retry-info" class="retry-info hidden"></div><div id="grid" class="grid"></div></section><div class="footer"><p>학습 기록은 이 브라우저에 저장돼.</p><div><button class="simple" id="export">기록 백업</button><button class="simple" id="import">백업 복원</button><input type="file" id="backup-file" accept="application/json,.json" hidden><button class="simple reset" id="reset">기록 초기화</button></div></div><section class="homework" aria-labelledby="homework-title"><div class="homework-head"><div><h2 id="homework-title">숙제 체크리스트</h2><p>완료한 숙제를 체크해. 이 브라우저에 저장돼.</p></div><span id="homework-count" aria-live="polite"></span></div><div id="homework-list"></div></section></main><script>
(async()=>{
const requestedDeck=new URL(location.href).searchParams.get('set');
const deck=['exam','voca45'].includes(requestedDeck)?requestedDeck:'voca';
const words=await fetch(deck==='exam'?'exam-words.json':deck==='voca45'?'voca-45-47.json':'words.json').then(r=>{if(!r.ok)throw Error();return r.json()});
const key=deck==='exam'?'vocab-exam-223-v1':deck==='voca45'?'vocab-45-47-v1':'vocab-memory-120-v1',orderKey=deck==='exam'?'vocab-exam-223-order-v1':deck==='voca45'?'vocab-45-47-order-v1':'vocab-memory-120-order-v1';
const selector=document.querySelector('#deck');selector.value=deck;selector.onchange=()=>{const url=new URL(location.href);if(selector.value!=='voca')url.searchParams.set('set',selector.value);else url.searchParams.delete('set');location.href=url.href};document.querySelector('.day').textContent=deck==='exam'?'2024년 3월 모의고사':deck==='voca45'?'DAY 45 — 47':'DAY 42 — 44';
if(deck==='voca45')document.querySelector('#day').innerHTML='<option value="all">전체</option><option value="45">Day 45</option><option value="46">Day 46</option><option value="47">Day 47</option>';
if(deck==='exam'){document.querySelector('#day').innerHTML='<option value="all">전체</option><option value="1">1–50번</option><option value="2">51–100번</option><option value="3">101–150번</option><option value="4">151–200번</option><option value="5">201–223번</option>';for(const el of document.querySelectorAll('#from,#to'))el.max=words.length;document.querySelector('#to').placeholder=words.length}
let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}
let mode='test',filter='all',revealed=new Set(),bookHidden=false,retry=null;
try{const saved=JSON.parse(localStorage.getItem(orderKey)||'null');if(Array.isArray(saved)&&saved.length===words.length&&new Set(saved).size===words.length&&saved.every(id=>words.some(w=>w.id===id))){const rank=new Map(saved.map((id,i)=>[id,i]));words.sort((a,b)=>rank.get(a.id)-rank.get(b.id))}}catch{}
const $=s=>document.querySelector(s),grid=$('#grid');
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('기록을 저장하지 못했어. 브라우저 저장 공간을 확인해 줘.')}}
function saveOrder(){try{localStorage.setItem(orderKey,JSON.stringify(words.map(w=>w.id)))}catch{alert('순서를 저장하지 못했어.')}}
function shuffleWords(){for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]]}saveOrder()}
function within(w){const day=$('#day').value;const low=Number($('#from').value)||1,high=Number($('#to').value)||words.length;return (day==='all'||(deck==='exam'?Math.floor((w.id-1)/50)+1:Math.floor((w.id-1)/40)+(deck==='voca45'?45:42))===Number(day))&&w.id>=low&&w.id<=high}
function makeRow(w){const row=document.createElement('div');row.className='row';const n=document.createElement('div');n.className='num';n.textContent=w.id;const word=document.createElement('div');word.className='word';word.textContent=w.word;
const hidden=mode==='test'||bookHidden;let answer=document.createElement(hidden?'button':'div');answer.className='meaning';if(hidden){answer.classList.add('cover');if(revealed.has(w.id))answer.classList.add('open');answer.setAttribute('aria-label',w.word+' 뜻 '+(revealed.has(w.id)?'가리기':'확인'));answer.setAttribute('aria-expanded',revealed.has(w.id));answer.textContent=revealed.has(w.id)?w.meaning:' ';answer.onclick=()=>{revealed.has(w.id)?revealed.delete(w.id):revealed.add(w.id);render()}}else answer.textContent=w.meaning;row.append(n,word,answer);
if(mode==='test'){const marks=document.createElement('div');marks.className='marks';for(const [value,label,cls] of [['known','O','yes'],['wrong','X','no']]){const b=document.createElement('button');b.textContent=label;const current=retry?retry.answers[w.id]:state[w.id];b.className=cls+(current===value?' on':'');b.setAttribute('aria-label',w.word+(value==='known'?' 외움':' 틀림'));b.setAttribute('aria-pressed',current===value);b.onclick=()=>{if(retry){retry.answers[w.id]=value;state[w.id]=value}else state[w.id]=state[w.id]===value?undefined:value;save();render()};marks.append(b)}row.append(marks)}return row}
function render(){const known=words.filter(w=>state[w.id]==='known').length,wrong=words.filter(w=>state[w.id]==='wrong').length;$('#counts').innerHTML=`전체 ${words.length} · <b>O ${known}</b> · <b class="x">X ${wrong}</b>`;$('#counts').classList.toggle('hidden',mode==='book');$('#filters').classList.toggle('hidden',mode==='book'||!!retry);$('#retry').classList.toggle('hidden',mode==='book'||!!retry);$('#reset').classList.toggle('hidden',mode==='book');$('#title').textContent=mode==='book'?'단어장':retry?'오답 재시험':'단어 테스트';$('#description').textContent=mode==='test'?'뜻이 가려진 칸을 눌러 확인하고 O 또는 X로 표시해.':'영단어와 뜻을 함께 살펴봐.';$('#toggle-all').textContent=(mode==='book'&&!bookHidden)|| (mode==='test'&&revealed.size===words.length)?'뜻 모두 가리기':'뜻 모두 보기';grid.classList.toggle('book',mode==='book');document.querySelectorAll('[data-mode]').forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
let q=$('#search').value.trim().toLowerCase();let selected=words.filter(w=>(retry?retry.ids.includes(w.id):(mode==='book'||filter==='all'||state[w.id]===filter))&&within(w)&&(w.word.toLowerCase().includes(q)||(mode==='book'&&!bookHidden&&w.meaning.includes(q))));
const info=$('#retry-info');info.classList.toggle('hidden',!retry);if(retry){let done=Object.keys(retry.answers).length;info.replaceChildren(document.createTextNode(`재시험 ${done} / ${retry.ids.length} 표시됨`));const finish=document.createElement('button');finish.textContent='재시험 끝내기';finish.onclick=()=>{const ans=Object.values(retry.answers);alert(`재시험 결과: O ${ans.filter(x=>x==='known').length}개 · X ${ans.filter(x=>x==='wrong').length}개 · 미표시 ${retry.ids.length-ans.length}개`);retry=null;filter='wrong';revealed.clear();render()};info.append(finish)}
grid.replaceChildren();if(!selected.length){const e=document.createElement('div');e.className='empty';e.textContent=q?'검색 결과가 없어.':filter==='wrong'?'X로 표시한 단어가 없어.':'선택한 범위에 표시할 단어가 없어.';grid.append(e);return}const middle=Math.ceil(selected.length/2);for(const chunk of [selected.slice(0,middle),selected.slice(middle)]){const column=document.createElement('div');column.className='column';chunk.forEach(w=>column.append(makeRow(w)));grid.append(column)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(retry&&!confirm('재시험을 끝내고 모드를 바꿀까? 이미 표시한 결과는 저장돼.'))return;retry=null;mode=b.dataset.mode;revealed.clear();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;revealed.clear();render()});
$('#retry').onclick=()=>{const ids=words.filter(w=>state[w.id]==='wrong'&&within(w)).map(w=>w.id);if(!ids.length){alert('선택한 범위에 X로 표시한 단어가 없어.');return}retry={ids,answers:{}};$('#search').value='';revealed.clear();render()};
$('#shuffle').onclick=()=>{if(confirm('단어 순서를 다시 섞을까?')){shuffleWords();revealed.clear();render()}};$('#restore-order').onclick=()=>{if(confirm('원래 단어 순서로 되돌릴까?')){words.sort((a,b)=>a.id-b.id);saveOrder();revealed.clear();render()}};
$('#toggle-all').onclick=()=>{if(mode==='book'){bookHidden=!bookHidden;revealed.clear()}else{const allVisible=words.every(w=>revealed.has(w.id));revealed=allVisible?new Set():new Set(words.map(w=>w.id))}render()};
for(const id of ['search','from','to','day'])$('#'+id).oninput=()=>{if(id!=='search')revealed.clear();render()};
$('#export').onclick=()=>{const data={format:'vocab-memory-backup',version:1,deck,date:new Date().toISOString(),state,order:words.map(w=>w.id)};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=deck==='exam'?'모의고사-학습기록.json':deck==='voca45'?'수능고난도-45-47-학습기록.json':'수능고난도-학습기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#import').onclick=()=>$('#backup-file').click();$('#backup-file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>100000)throw Error();const data=JSON.parse(await f.text());if(data.format!=='vocab-memory-backup'||data.version!==1||(data.deck||'voca')!==deck||!data.state||typeof data.state!=='object'||Array.isArray(data.state)||Object.entries(data.state).some(([id,v])=>!Number.isInteger(Number(id))||Number(id)<1||Number(id)>words.length||!['known','wrong'].includes(v))||!Array.isArray(data.order)||data.order.length!==words.length||new Set(data.order).size!==words.length||data.order.some(id=>!Number.isInteger(id)||id<1||id>words.length))throw Error();if(!confirm('현재 O·X 기록과 순서를 백업 내용으로 바꿀까?'))return;state=data.state;const rank=new Map(data.order.map((id,i)=>[id,i]));words.sort((a,b)=>rank.get(a.id)-rank.get(b.id));retry=null;revealed.clear();save();saveOrder();render();alert('기록을 복원했어.')}catch{alert('유효한 단어장 백업 파일을 읽지 못했어.')}};
$('#reset').onclick=()=>{if(confirm('모든 학습 기록을 초기화할까?')){state={};retry=null;revealed.clear();save();render()}};render()})().catch(()=>{document.querySelector('#grid').textContent='단어를 불러오지 못했어. 페이지를 새로고침해 줘.'});

(()=>{const tasks=['24년 고3 7월 모의고사 풀고 오답','하이퍼V1 3~4강','그럼에도 불구하고 18~31p 풀고 오답','24년 고3 10월 모의고사 DQ'];const storageKey='vocab-homework-v1';let checked={};try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))checked=saved}catch{}const list=document.querySelector('#homework-list'),count=document.querySelector('#homework-count');function updateCount(){count.textContent=`${tasks.filter((_,i)=>checked[i]===true).length} / ${tasks.length} 완료`}tasks.forEach((task,i)=>{const label=document.createElement('label'),box=document.createElement('input'),text=document.createElement('span');box.type='checkbox';box.checked=checked[i]===true;text.textContent=task;box.onchange=()=>{checked[i]=box.checked;try{localStorage.setItem(storageKey,JSON.stringify(checked))}catch{box.checked=!box.checked;checked[i]=box.checked;alert('숙제 상태를 저장하지 못했어. 브라우저 저장 공간을 확인해 줘.')}updateCount()};label.append(box,text);list.append(label)});updateCount()})();

if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('./sw.js').then(async registration => {
    await navigator.serviceWorker.ready;
    const cache = await caches.open('vocab-offline-v4');
    const [home, words, exam, extra] = await Promise.all([cache.match(new URL('./', location.href).href), cache.match(new URL('./words.json', location.href).href), cache.match(new URL('./exam-words.json', location.href).href), cache.match(new URL('./voca-45-47.json', location.href).href)]);
    document.querySelector('#offline-status').textContent = home && words && exam && extra ? '오프라인 사용 가능' : '오프라인 준비 중';
  }).catch(() => { document.querySelector('#offline-status').textContent='오프라인 준비 실패 · 인터넷 연결 확인'; });
} else document.querySelector('#offline-status').textContent='이 브라우저는 오프라인 저장을 지원하지 않아';
</script></body></html>
